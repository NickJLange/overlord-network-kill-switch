[general]
ubiquiti_control_enabled: yes
pihole_control_enabled: yes
mqtt_announce_enabled: yes
remote_pi_list: pihole
remote_pi_password: local-pihole-only

[mqtt]
broker: mqtt
port: 1883
lwt_topics: stat/ubiquiti_controller/service_status
            stat/dns_controller/master/service_status

[ubiquiti]
remote_ubiquiti_device: unifi:8443
remote_ubiquiti_api_key: local-simulator-only

[ubiquiti_targets]

[ubiquiti_rules]
rules: Allow_YouTube_Approved
       Allow_Internet_Approved

[block_domains]
youtube: youtube.com
         googlevideo.com

[allow_domains]
school: school.example.test
